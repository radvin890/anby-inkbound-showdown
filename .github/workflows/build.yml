name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Desktop Wrapper
        run: |
          npm init -y
          npm install electron electron-builder --save-dev
          node -e "const fs=require('fs'); fs.writeFileSync('main.js', 'const {app,BrowserWindow}=require(\"electron\");app.whenReady().then(()=>{const win=new BrowserWindow({width:1280,height:720,autoHideMenuBar:true,title:\"Anby: Inkbound Showdown\"});win.loadURL(\"https://anby-inkbound-showdown.lovable.app\");});app.on(\"window-all-closed\",()=>app.quit());');"
          node -e "const pkg=require('./package.json'); pkg.main='main.js'; pkg.build={appId:'com.anby.inkbound',productName:'Anby Inkbound Showdown',win:{target:'portable'}}; fs.writeFileSync('./package.json',JSON.stringify(pkg,null,2));"

      - name: Build Portable Windows EXE
        run: npx electron-builder --win

      - name: Upload EXE File
        uses: actions/upload-artifact@v4
        with:
          name: Anby-Game-Windows
          path: dist/*.exe
