name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Desktop Application
        shell: bash
        run: |
          mkdir desktop
          cd desktop
          cat << 'EOF' > package.json
          {
            "name": "anby-inkbound-showdown",
            "version": "1.0.0",
            "main": "main.js"
          }
          EOF
          cat << 'EOF' > main.js
          const { app, BrowserWindow } = require('electron');

          app.whenReady().then(() => {
            const win = new BrowserWindow({
              width: 1280,
              height: 720,
              autoHideMenuBar: true,
              title: "Anby: Inkbound Showdown"
            });
            win.loadURL("https://anby-inkbound-showdown.lovable.app");
          });

          app.on('window-all-closed', () => {
            app.quit();
          });
          EOF
          npm install electron electron-builder --save-dev
          npx electron-builder --win portable --config.productName="Anby Inkbound Showdown" --config.appId="com.anby.game"

      - name: Upload EXE File
        uses: actions/upload-artifact@v4
        with:
          name: Anby-Game-Windows
          path: desktop/dist/*.exe
